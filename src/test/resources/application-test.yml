# Configuration utilisée uniquement pendant les tests (profil "test").
# Base H2 en mémoire : aucune dépendance à Neon/PostgreSQL pour lancer les tests.
spring:
  datasource:
    url: jdbc:h2:mem:collecteo_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

JWT_SECRET: collecteo-test-secret-key-pour-les-tests-uniquement-32c
JWT_EXPIRATION_MS: 3600000

logging:
  level:
    org.hibernate.SQL: warn
