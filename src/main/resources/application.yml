server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: collecteo-backend

  datasource:
    # Valeurs par défaut codées en dur pour le développement local (pas besoin de
    # configurer des variables d'environnement dans IntelliJ). Surchargeables via
    # DB_URL / DB_USERNAME / DB_PASSWORD si besoin (ex. en production).
    url: ${DB_URL:jdbc:postgresql://ep-bitter-smoke-asyw3792.c-4.eu-central-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_dF8nIgH2lbXG}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # update = crée les tables manquantes et ajoute les colonnes manquantes au démarrage,
      # sans jamais supprimer de données existantes.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: debug
