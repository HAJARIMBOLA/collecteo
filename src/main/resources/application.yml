server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: collecteo-backend

  datasource:
    # OBLIGATOIRE : DB_URL / DB_USERNAME / DB_PASSWORD doivent être définies en
    # variables d'environnement (jamais de valeur par défaut ici : un secret
    # codé en dur finit toujours par être committé sur Git). Voir .env.example
    # pour le format attendu, et le README pour comment les configurer dans
    # IntelliJ (Edit Configurations > Environment variables) ou via un fichier
    # .env local non versionné (plugin EnvFile).
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # update = crée les tables manquantes et ajoute les colonnes manquantes au démarrage,
      # sans jamais supprimer de données existantes.
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:warn}