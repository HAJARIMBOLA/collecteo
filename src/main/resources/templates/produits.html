<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Produits')}"></head>
<body>
<div th:replace="~{fragments :: sidebar('produits')}"></div>

<main class="content">
  <h3 class="page-title"><i class="bi bi-box-seam"></i> Produits</h3>
  <div id="errorBox" class="alert alert-danger d-none"></div>
  <div id="successBox" class="alert alert-success d-none"></div>

  <div class="row g-3" id="cartesKpi"></div>

  <div class="row g-3 mt-1">
    <div class="col-lg-4">
      <div class="card card-section">
        <div class="card-body">
          <h6 class="fw-bold mb-3" id="titreFormulaire"><i class="bi bi-plus-circle"></i> Nouveau produit</h6>
          <p class="text-muted small">Les prix moyens et la quantité en stock sont recalculés automatiquement à chaque achat / vente.</p>
          <form id="formProduit">
            <div class="mb-2">
              <label class="form-label">Nom *</label>
              <input type="text" class="form-control" id="nom" required/>
            </div>
            <div class="mb-2">
              <label class="form-label">Catégorie</label>
              <input type="text" class="form-control" id="categorie" placeholder="Ex : Café, Vanille..."/>
            </div>
            <div class="mb-3">
              <label class="form-label">Unité de mesure</label>
              <input type="text" class="form-control" id="unite" value="kg"/>
            </div>
            <button type="submit" class="btn btn-collecteo w-100">Créer</button>
          </form>
        </div>
      </div>

      <div class="card card-section">
        <div class="card-body">
          <h6 class="fw-bold mb-3"><i class="bi bi-exclamation-triangle"></i> Alerte rupture de stock</h6>
          <form class="row g-2 align-items-end mb-2" id="formSeuil">
            <div class="col-8">
              <label class="form-label">Seuil (quantité)</label>
              <input type="number" step="0.01" class="form-control" id="seuil" value="0"/>
            </div>
            <div class="col-4">
              <button class="btn btn-outline-warning w-100" type="submit">Vérifier</button>
            </div>
          </form>
          <ul class="list-group list-group-flush" id="listeRupture"></ul>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card card-section">
        <div class="card-body">
          <table class="table table-hover table-collecteo align-middle">
            <thead>
              <tr>
                <th>Nom</th><th>Catégorie</th><th>Unité</th>
                <th class="text-end">Stock</th><th class="text-end">Prix moy. achat</th>
                <th class="text-end">Prix moy. vente</th><th class="text-end">Valeur stock</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="corpsTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments :: scripts}"></div>
<script>
  requireAuth();

  function rendreLigne(p) {
    const valeur = (p.quantiteStock || 0) * (p.prixMoyenAchat || 0);
    return `<tr>
      <td>${escapeHtml(p.nom)}</td>
      <td>${escapeHtml(p.categorie || "—")}</td>
      <td>${escapeHtml(p.unite)}</td>
      <td class="text-end">${Number(p.quantiteStock).toLocaleString("fr-FR")}</td>
      <td class="text-end">${formatMontant(p.prixMoyenAchat)}</td>
      <td class="text-end">${formatMontant(p.prixMoyenVente)}</td>
      <td class="text-end fw-semibold">${formatMontant(valeur)}</td>
      <td class="text-end">
        <button class="btn btn-sm btn-outline-danger" onclick="supprimer(${p.id})"><i class="bi bi-trash"></i></button>
      </td>
    </tr>`;
  }

  let derniereListe = [];

  async function charger() {
    try {
      clearError();
      derniereListe = await api("/produits");
      document.getElementById("corpsTable").innerHTML =
        derniereListe.length ? derniereListe.map(rendreLigne).join("") : '<tr><td colspan="8" class="text-center text-muted py-3">Aucun produit.</td></tr>';

      const valeurStock = await api("/produits/valeur-stock");
      document.getElementById("cartesKpi").innerHTML = `
        <div class="col-sm-6 col-lg-3">
          <div class="card kpi-card"><div class="card-body">
            <div class="kpi-label">Nombre de produits</div>
            <div class="kpi-value">${derniereListe.length}</div>
          </div></div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="card kpi-card"><div class="card-body">
            <div class="kpi-label">Valeur totale du stock</div>
            <div class="kpi-value">${formatMontant(valeurStock)}</div>
          </div></div>
        </div>`;
    } catch (err) {
      showError(err.message);
    }
  }

  async function supprimer(id) {
    if (!confirm("Supprimer ce produit ?")) return;
    try {
      await api("/produits/" + id, { method: "DELETE" });
      showSuccess("Produit supprimé.");
      charger();
    } catch (err) {
      showError(err.message);
    }
  }

  document.getElementById("formProduit").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError();
    const corps = {
      nom: document.getElementById("nom").value.trim(),
      categorie: document.getElementById("categorie").value.trim(),
      unite: document.getElementById("unite").value.trim() || "kg",
    };
    try {
      await api("/produits", { method: "POST", body: JSON.stringify(corps) });
      showSuccess("Produit créé.");
      document.getElementById("formProduit").reset();
      document.getElementById("unite").value = "kg";
      charger();
    } catch (err) {
      showError(err.message);
    }
  });

  document.getElementById("formSeuil").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const seuil = document.getElementById("seuil").value || 0;
      const liste = await api("/produits/rupture?seuil=" + encodeURIComponent(seuil));
      document.getElementById("listeRupture").innerHTML = liste.length
        ? liste.map((p) => `<li class="list-group-item d-flex justify-content-between">
             <span>${escapeHtml(p.nom)}</span>
             <span class="text-danger fw-semibold">${Number(p.quantiteStock).toLocaleString("fr-FR")} ${escapeHtml(p.unite)}</span>
           </li>`).join("")
        : '<li class="list-group-item text-muted">Aucun produit sous ce seuil.</li>';
    } catch (err) {
      showError(err.message);
    }
  });

  charger();
</script>
</body>
</html>
