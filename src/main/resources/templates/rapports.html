<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Rapports')}"></head>
<body>
<div th:replace="~{fragments :: sidebar('rapports')}"></div>

<main class="content">
  <h3 class="page-title"><i class="bi bi-file-earmark-arrow-down"></i> Rapports</h3>
  <p class="text-muted">Export des données au format Excel ou PDF.</p>
  <div id="errorBox" class="alert alert-danger d-none"></div>

  <div class="row g-3">
    <div class="col-md-4">
      <div class="card card-section">
        <div class="card-body text-center">
          <i class="bi bi-file-earmark-spreadsheet fs-1 text-success"></i>
          <h6 class="fw-bold mt-2">Ventes (Excel)</h6>
          <button class="btn btn-collecteo w-100 mt-2" onclick="telecharger('/rapports/ventes/excel', 'ventes.xlsx')">
            <i class="bi bi-download"></i> Télécharger
          </button>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card card-section">
        <div class="card-body text-center">
          <i class="bi bi-file-earmark-spreadsheet fs-1 text-success"></i>
          <h6 class="fw-bold mt-2">Achats (Excel)</h6>
          <button class="btn btn-collecteo w-100 mt-2" onclick="telecharger('/rapports/achats/excel', 'achats.xlsx')">
            <i class="bi bi-download"></i> Télécharger
          </button>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card card-section">
        <div class="card-body text-center">
          <i class="bi bi-file-earmark-pdf fs-1 text-danger"></i>
          <h6 class="fw-bold mt-2">Rapport financier (PDF)</h6>
          <button class="btn btn-collecteo w-100 mt-2" onclick="telecharger('/rapports/financier/pdf', 'rapport-financier.pdf')">
            <i class="bi bi-download"></i> Télécharger
          </button>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments :: scripts}"></div>
<script>
  requireAuth();

  async function telecharger(chemin, nomFichier) {
    clearError();
    try {
      await apiDownload(chemin, nomFichier);
    } catch (err) {
      showError(err.message || "Le téléchargement a échoué.");
    }
  }
</script>
</body>
</html>
