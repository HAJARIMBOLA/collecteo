<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Dépenses')}"></head>
<body>
<div th:replace="~{fragments :: sidebar('depenses')}"></div>

<main class="content">
  <h3 class="page-title"><i class="bi bi-receipt"></i> Dépenses</h3>
  <p class="text-muted">Chaque dépense enregistrée déclenche automatiquement une sortie de caisse.</p>
  <div id="errorBox" class="alert alert-danger d-none"></div>
  <div id="successBox" class="alert alert-success d-none"></div>

  <div class="row g-3" id="cartesKpi"></div>

  <div class="row g-3 mt-1">
    <div class="col-lg-4">
      <div class="card card-section">
        <div class="card-body">
          <h6 class="fw-bold mb-3"><i class="bi bi-plus-circle"></i> Nouvelle dépense</h6>
          <form id="formDepense">
            <div class="mb-2">
              <label class="form-label">Catégorie *</label>
              <select class="form-select" id="categorie" required>
                <option value="TRANSPORT">Transport</option>
                <option value="CARBURANT">Carburant</option>
                <option value="SALAIRES">Salaires</option>
                <option value="TELEPHONE">Téléphone</option>
                <option value="INTERNET">Internet</option>
                <option value="REPARATION">Réparation</option>
                <option value="BANQUE">Banque</option>
                <option value="TAXES">Taxes</option>
                <option value="DIVERS">Divers</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Montant *</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="montant" required/>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <input type="text" class="form-control" id="description"/>
            </div>
            <button type="submit" class="btn btn-collecteo w-100">Enregistrer</button>
          </form>
        </div>
      </div>

      <div class="card card-section">
        <div class="card-body">
          <h6 class="fw-bold mb-3">Total par catégorie</h6>
          <ul class="list-group list-group-flush" id="listeParCategorie"></ul>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card card-section">
        <div class="card-body">
          <form class="row g-2 align-items-end mb-3" id="formFiltre">
            <div class="col-auto">
              <label class="form-label">Filtrer par catégorie</label>
              <select class="form-select" id="filtreCategorie">
                <option value="">Toutes</option>
                <option value="TRANSPORT">Transport</option>
                <option value="CARBURANT">Carburant</option>
                <option value="SALAIRES">Salaires</option>
                <option value="TELEPHONE">Téléphone</option>
                <option value="INTERNET">Internet</option>
                <option value="REPARATION">Réparation</option>
                <option value="BANQUE">Banque</option>
                <option value="TAXES">Taxes</option>
                <option value="DIVERS">Divers</option>
              </select>
            </div>
            <div class="col-auto">
              <button class="btn btn-outline-secondary" type="submit">Appliquer</button>
            </div>
          </form>
          <table class="table table-hover table-collecteo align-middle">
            <thead><tr><th>Date</th><th>Catégorie</th><th class="text-end">Montant</th><th>Description</th></tr></thead>
            <tbody id="corpsTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments :: scripts}"></div>
<script>
  requireAuth();

  function rendreLigne(d) {
    return `<tr>
      <td>${formatDate(d.date)}</td>
      <td>${escapeHtml(d.categorie.replaceAll("_", " "))}</td>
      <td class="text-end">${formatMontant(d.montant)}</td>
      <td>${escapeHtml(d.description || "—")}</td>
    </tr>`;
  }

  async function charger(categorie) {
    try {
      clearError();
      const liste = categorie ? await api("/depenses/categorie/" + categorie) : await api("/depenses");
      const tri = liste.sort((a, b) => new Date(b.date) - new Date(a.date));
      document.getElementById("corpsTable").innerHTML =
        tri.length ? tri.map(rendreLigne).join("") : '<tr><td colspan="4" class="text-center text-muted py-3">Aucune dépense.</td></tr>';

      const [total, parCategorie] = await Promise.all([api("/depenses/total"), api("/depenses/par-categorie")]);
      document.getElementById("cartesKpi").innerHTML = `
        <div class="col-sm-6 col-lg-3">
          <div class="card kpi-card"><div class="card-body">
            <div class="kpi-label">Total des dépenses</div><div class="kpi-value">${formatMontant(total)}</div>
          </div></div>
        </div>`;
      document.getElementById("listeParCategorie").innerHTML = Object.entries(parCategorie)
        .sort((a, b) => b[1] - a[1])
        .map(([cat, montant]) => `<li class="list-group-item d-flex justify-content-between">
            <span>${escapeHtml(cat.replaceAll("_", " "))}</span><span class="fw-semibold">${formatMontant(montant)}</span>
          </li>`).join("") || '<li class="list-group-item text-muted">Aucune donnée.</li>';
    } catch (err) {
      showError(err.message);
    }
  }

  document.getElementById("formFiltre").addEventListener("submit", (e) => {
    e.preventDefault();
    charger(document.getElementById("filtreCategorie").value);
  });

  document.getElementById("formDepense").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError();
    const corps = {
      categorie: document.getElementById("categorie").value,
      montant: Number(document.getElementById("montant").value),
      description: document.getElementById("description").value.trim(),
    };
    try {
      await api("/depenses", { method: "POST", body: JSON.stringify(corps) });
      showSuccess("Dépense enregistrée.");
      document.getElementById("formDepense").reset();
      charger();
    } catch (err) {
      showError(err.message);
    }
  });

  charger();
</script>
</body>
</html>
