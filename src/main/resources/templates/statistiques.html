<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Statistiques')}"></head>
<body>
<div th:replace="~{fragments :: sidebar('statistiques')}"></div>

<main class="content">
  <h3 class="page-title"><i class="bi bi-bar-chart-line"></i> Statistiques</h3>
  <div id="errorBox" class="alert alert-danger d-none"></div>

  <div class="card card-section">
    <div class="card-body">
      <h6 class="fw-bold mb-3">Évolution mensuelle : ventes, achats, dépenses, bénéfice</h6>
      <canvas id="graphiqueEvolution" height="90"></canvas>
    </div>
  </div>

  <div class="card card-section">
    <div class="card-body">
      <h6 class="fw-bold mb-3">Répartition des dépenses par catégorie</h6>
      <canvas id="graphiqueDepenses" height="110"></canvas>
    </div>
  </div>
</main>

<div th:replace="~{fragments :: scripts}"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
  requireAuth();

  function versSerie(map) {
    const mois = Object.keys(map).sort();
    return { mois, valeurs: mois.map((m) => map[m]) };
  }

  async function charger() {
    try {
      clearError();
      const s = await api("/statistiques");

      const ventes = versSerie(s.ventesParMois);
      const achats = versSerie(s.achatsParMois);
      const depenses = versSerie(s.depensesParMois);
      const benefice = versSerie(s.beneficeParMois);

      new Chart(document.getElementById("graphiqueEvolution"), {
        type: "line",
        data: {
          labels: ventes.mois,
          datasets: [
            { label: "Ventes", data: ventes.valeurs, borderColor: "#1c6b4f", backgroundColor: "#1c6b4f", tension: .3 },
            { label: "Achats", data: achats.valeurs, borderColor: "#c0392b", backgroundColor: "#c0392b", tension: .3 },
            { label: "Dépenses", data: depenses.valeurs, borderColor: "#e67e22", backgroundColor: "#e67e22", tension: .3 },
            { label: "Bénéfice", data: benefice.valeurs, borderColor: "#2980b9", backgroundColor: "#2980b9", tension: .3 },
          ],
        },
        options: { responsive: true, plugins: { legend: { position: "bottom" } } },
      });

      const depensesParCategorie = s.depensesParCategorie || {};
      new Chart(document.getElementById("graphiqueDepenses"), {
        type: "doughnut",
        data: {
          labels: Object.keys(depensesParCategorie).map((c) => c.replaceAll("_", " ")),
          datasets: [{
            data: Object.values(depensesParCategorie),
            backgroundColor: ["#1c6b4f","#c0392b","#e67e22","#2980b9","#8e44ad","#16a085","#f39c12","#7f8c8d","#2c3e50"],
          }],
        },
        options: { responsive: true, plugins: { legend: { position: "right" } } },
      });
    } catch (err) {
      showError(err.message);
    }
  }

  charger();
</script>
</body>
</html>
