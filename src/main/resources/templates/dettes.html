<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Dettes fournisseurs')}"></head>
<body>
<div th:replace="~{fragments :: sidebar('dettes')}"></div>

<main class="content">
  <h3 class="page-title"><i class="bi bi-exclamation-circle"></i> Dettes fournisseurs</h3>
  <p class="text-muted">Dettes hors achats aux producteurs (déjà suivis dans "Achats") : factures, prestataires, réparations...</p>
  <div id="errorBox" class="alert alert-danger d-none"></div>
  <div id="successBox" class="alert alert-success d-none"></div>

  <div class="row g-3" id="cartesKpi"></div>

  <div class="row g-3 mt-1">
    <div class="col-lg-4">
      <div class="card card-section">
        <div class="card-body">
          <h6 class="fw-bold mb-3"><i class="bi bi-plus-circle"></i> Nouvelle dette</h6>
          <form id="formDette">
            <div class="mb-2">
              <label class="form-label">Fournisseur *</label>
              <input type="text" class="form-control" id="fournisseur" required/>
            </div>
            <div class="mb-2">
              <label class="form-label">Motif</label>
              <input type="text" class="form-control" id="motif"/>
            </div>
            <div class="mb-2">
              <label class="form-label">Montant *</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="montant" required/>
            </div>
            <div class="mb-3">
              <label class="form-label">Date limite</label>
              <input type="date" class="form-control" id="dateLimite"/>
            </div>
            <button type="submit" class="btn btn-collecteo w-100">Enregistrer</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card card-section">
        <div class="card-body d-flex justify-content-between align-items-center mb-2">
          <h6 class="fw-bold mb-0">Liste des dettes</h6>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="filtreNonSoldees" checked/>
            <label class="form-check-label small" for="filtreNonSoldees">Non soldées uniquement</label>
          </div>
        </div>
        <div class="card-body pt-0">
          <table class="table table-hover table-collecteo align-middle">
            <thead>
              <tr>
                <th>Fournisseur</th><th>Motif</th><th class="text-end">Montant</th>
                <th class="text-end">Restant</th><th>Échéance</th><th>Statut</th><th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="corpsTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Modale de paiement -->
<div class="modal fade" id="modalPaiement" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Enregistrer un paiement</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="formPaiement">
        <div class="modal-body">
          <input type="hidden" id="detteIdPaiement"/>
          <p>Montant restant dû : <strong id="montantRestantAffiche"></strong></p>
          <label class="form-label">Montant payé *</label>
          <input type="number" step="0.01" min="0.01" class="form-control" id="montantPaiement" required/>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" class="btn btn-collecteo">Valider le paiement</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
<script>
  requireAuth();
  let modalPaiement;

  function rendreLigne(d) {
    return `<tr>
      <td>${escapeHtml(d.fournisseur)}</td>
      <td>${escapeHtml(d.motif || "—")}</td>
      <td class="text-end">${formatMontant(d.montant)}</td>
      <td class="text-end">${formatMontant(d.montantRestant)}</td>
      <td>${formatDateSeule(d.dateLimite)}</td>
      <td>${badgeStatut(d.statut)}</td>
      <td class="text-end">
        ${Number(d.montantRestant) > 0
          ? `<button class="btn btn-sm btn-outline-success" onclick="ouvrirPaiement(${d.id}, ${d.montantRestant})"><i class="bi bi-cash"></i> Payer</button>`
          : ""}
      </td>
    </tr>`;
  }

  async function charger() {
    try {
      clearError();
      const nonSoldeesUniquement = document.getElementById("filtreNonSoldees").checked;
      const [liste, total] = await Promise.all([
        nonSoldeesUniquement ? api("/dettes/non-soldees") : api("/dettes"),
        api("/dettes/total"),
      ]);
      document.getElementById("corpsTable").innerHTML =
        liste.length ? liste.map(rendreLigne).join("") : '<tr><td colspan="7" class="text-center text-muted py-3">Aucune dette.</td></tr>';

      document.getElementById("cartesKpi").innerHTML = `
        <div class="col-sm-6 col-lg-3">
          <div class="card kpi-card"><div class="card-body">
            <div class="kpi-label">Total dettes fournisseurs</div><div class="kpi-value">${formatMontant(total)}</div>
          </div></div>
        </div>`;
    } catch (err) {
      showError(err.message);
    }
  }

  function ouvrirPaiement(id, montantRestant) {
    document.getElementById("detteIdPaiement").value = id;
    document.getElementById("montantRestantAffiche").textContent = formatMontant(montantRestant);
    document.getElementById("montantPaiement").value = "";
    document.getElementById("montantPaiement").max = montantRestant;
    modalPaiement.show();
  }

  document.getElementById("filtreNonSoldees").addEventListener("change", charger);

  document.getElementById("formDette").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError();
    const corps = {
      fournisseur: document.getElementById("fournisseur").value.trim(),
      motif: document.getElementById("motif").value.trim(),
      montant: Number(document.getElementById("montant").value),
      dateLimite: document.getElementById("dateLimite").value || null,
    };
    try {
      await api("/dettes", { method: "POST", body: JSON.stringify(corps) });
      showSuccess("Dette enregistrée.");
      document.getElementById("formDette").reset();
      charger();
    } catch (err) {
      showError(err.message);
    }
  });

  document.getElementById("formPaiement").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = document.getElementById("detteIdPaiement").value;
    const montant = Number(document.getElementById("montantPaiement").value);
    try {
      await api("/dettes/" + id + "/paiement", { method: "POST", body: JSON.stringify({ montant }) });
      modalPaiement.hide();
      showSuccess("Paiement enregistré.");
      charger();
    } catch (err) {
      showError(err.message);
    }
  });

  modalPaiement = new bootstrap.Modal(document.getElementById("modalPaiement"));
  charger();
</script>
</body>
</html>
