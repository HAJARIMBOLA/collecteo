<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>fragments (non utilisé directement)</title></head>
<body>

<!-- ========== HEAD COMMUN ========== -->
<th:block th:fragment="head(titre)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${titre} + ' · Collecteo'">Collecteo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</th:block>

<!-- ========== BARRE LATERALE ========== -->
<nav th:fragment="sidebar(actif)" class="sidebar">
  <div class="sidebar-brand">
    <i class="bi bi-basket3-fill"></i> <span>Collecteo</span>
  </div>
  <div class="sidebar-user">
    <i class="bi bi-person-circle"></i>
    <span id="nomUtilisateurCourant">…</span>
  </div>
  <ul class="nav flex-column sidebar-nav">
    <li class="nav-item">
      <a class="nav-link" th:classappend="${actif == 'dashboard'} ? 'active'" href="/dashboard">
        <i class="bi bi-speedometer2"></i> Tableau de bord</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:classappend="${actif == 'ventes'} ? 'active'" href="/ventes">
        <i class="bi bi-cart-check"></i> Ventes</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:classappend="${actif == 'achats'} ? 'active'" href="/achats">
        <i class="bi bi-cart-plus"></i> Achats</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:classappend="${actif == 'produits'} ? 'active'" href="/produits">
        <i class="bi bi-box-seam"></i> Produits</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:classappend="${actif == 'clients'} ? 'active'" href="/clients">
        <i class="bi bi-people"></i> Clients</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:classappend="${actif == 'producteurs'} ? 'active'" href="/producteurs">
        <i class="bi bi-person-badge"></i> Producteurs</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:classappend="${actif == 'dettes'} ? 'active'" href="/dettes">
        <i class="bi bi-exclamation-circle"></i> Dettes fournisseurs</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:classappend="${actif == 'caisse'} ? 'active'" href="/caisse">
        <i class="bi bi-cash-stack"></i> Caisse</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:classappend="${actif == 'banque'} ? 'active'" href="/banque">
        <i class="bi bi-bank"></i> Banque</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:classappend="${actif == 'prets'} ? 'active'" href="/prets">
        <i class="bi bi-graph-up-arrow"></i> Prêts bancaires</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:classappend="${actif == 'depenses'} ? 'active'" href="/depenses">
        <i class="bi bi-receipt"></i> Dépenses</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:classappend="${actif == 'statistiques'} ? 'active'" href="/statistiques">
        <i class="bi bi-bar-chart-line"></i> Statistiques</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" th:classappend="${actif == 'rapports'} ? 'active'" href="/rapports">
        <i class="bi bi-file-earmark-arrow-down"></i> Rapports</a>
    </li>
    <li class="nav-item admin-only">
      <a class="nav-link" th:classappend="${actif == 'utilisateurs'} ? 'active'" href="/utilisateurs">
        <i class="bi bi-shield-lock"></i> Utilisateurs</a>
    </li>
  </ul>
  <button class="btn btn-outline-light btn-sm sidebar-logout" onclick="logout()">
    <i class="bi bi-box-arrow-right"></i> Déconnexion
  </button>
</nav>

<!-- ========== SCRIPTS COMMUNS ========== -->
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/api.js}"></script>
</th:block>

</body>
</html>
