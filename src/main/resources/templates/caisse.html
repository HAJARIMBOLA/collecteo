<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Caisse')}"></head>
<body>
<div th:replace="~{fragments :: sidebar('caisse')}"></div>

<main class="content">
  <h3 class="page-title"><i class="bi bi-cash-stack"></i> Caisse</h3>
  <div id="errorBox" class="alert alert-danger d-none"></div>
  <div id="successBox" class="alert alert-success d-none"></div>

  <div class="row g-3" id="cartesKpi"></div>

  <div class="row g-3 mt-1">
    <div class="col-lg-4">
      <div class="card card-section">
        <div class="card-body">
          <h6 class="fw-bold mb-3"><i class="bi bi-plus-circle"></i> Nouveau mouvement</h6>
          <p class="text-muted small">Les ventes et achats alimentent déjà la caisse automatiquement. Utilisez ce formulaire pour les apports, salaires, carburant, etc.</p>
          <form id="formMouvement">
            <div class="mb-2">
              <label class="form-label">Type *</label>
              <select class="form-select" id="type" required>
                <option value="ENTREE">Entrée</option>
                <option value="SORTIE">Sortie</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Catégorie *</label>
              <select class="form-select" id="categorie" required>
                <option value="VENTE">Vente</option>
                <option value="REMBOURSEMENT_CLIENT">Remboursement client</option>
                <option value="APPORT_PROPRIETAIRE">Apport propriétaire</option>
                <option value="AUTRE_ENTREE">Autre entrée</option>
                <option value="ACHAT">Achat</option>
                <option value="SALAIRE">Salaire</option>
                <option value="CARBURANT">Carburant</option>
                <option value="TRANSPORT">Transport</option>
                <option value="DIVERS">Divers</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Montant *</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="montant" required/>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <input type="text" class="form-control" id="description"/>
            </div>
            <button type="submit" class="btn btn-collecteo w-100">Enregistrer</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card card-section">
        <div class="card-body">
          <h6 class="fw-bold mb-3">Mouvements de caisse</h6>
          <table class="table table-hover table-collecteo align-middle">
            <thead>
              <tr><th>Date</th><th>Type</th><th>Catégorie</th><th class="text-end">Montant</th><th>Description</th></tr>
            </thead>
            <tbody id="corpsTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments :: scripts}"></div>
<script>
  requireAuth();

  function rendreLigne(t) {
    const couleur = t.type === "ENTREE" ? "success" : "danger";
    const signe = t.type === "ENTREE" ? "+" : "−";
    return `<tr>
      <td>${formatDate(t.date)}</td>
      <td><span class="badge text-bg-${couleur}">${t.type === "ENTREE" ? "Entrée" : "Sortie"}</span></td>
      <td>${escapeHtml(t.categorie.replaceAll("_", " "))}</td>
      <td class="text-end text-${couleur} fw-semibold">${signe} ${formatMontant(t.montant)}</td>
      <td>${escapeHtml(t.description || "—")}</td>
    </tr>`;
  }

  async function charger() {
    try {
      clearError();
      const [liste, solde] = await Promise.all([api("/caisse/transactions"), api("/caisse/solde")]);
      const tri = liste.sort((a, b) => new Date(b.date) - new Date(a.date));
      document.getElementById("corpsTable").innerHTML =
        tri.length ? tri.map(rendreLigne).join("") : '<tr><td colspan="5" class="text-center text-muted py-3">Aucun mouvement.</td></tr>';

      document.getElementById("cartesKpi").innerHTML = `
        <div class="col-sm-6 col-lg-3">
          <div class="card kpi-card"><div class="card-body">
            <div class="kpi-label">Solde actuel de la caisse</div>
            <div class="kpi-value">${formatMontant(solde)}</div>
          </div></div>
        </div>`;
    } catch (err) {
      showError(err.message);
    }
  }

  document.getElementById("formMouvement").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError();
    const corps = {
      type: document.getElementById("type").value,
      categorie: document.getElementById("categorie").value,
      montant: Number(document.getElementById("montant").value),
      description: document.getElementById("description").value.trim(),
    };
    try {
      await api("/caisse/transactions", { method: "POST", body: JSON.stringify(corps) });
      showSuccess("Mouvement enregistré.");
      document.getElementById("formMouvement").reset();
      charger();
    } catch (err) {
      showError(err.message);
    }
  });

  charger();
</script>
</body>
</html>
